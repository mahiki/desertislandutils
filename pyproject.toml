[project]
name = "desertislandutils"
version = "0.4.2"
description = "A collection of personal convenience utilities"
authors = [{name = "mahiki", email = "mahiki@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argparse>=1.4.0",
    "GitPython>=3.1.27",
    "typer>=0.12.0",
    "pendulum>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ptpython>=3.0.23",
]
test = [
    "pytest>=7.2.2",
]

[project.scripts]
too = "src.toobigdatadoc.too:main"
wn = "src.weeknumber.wn:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
